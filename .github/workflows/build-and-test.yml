name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cmake:
    name: CMake (${{ matrix.qt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - qt: Qt 5
            packages: qtbase5-dev
            serialport: libqt5serialport5-dev
          - qt: Qt 6
            packages: qt6-base-dev
            # Ubuntu 26.04 renamed libqt6serialport6-dev to qt6-serialport-dev.
            serialport: libqt6serialport6-dev qt6-serialport-dev
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and build tools
        run: |
          sudo apt-get update
          serialport=""
          for candidate in ${{ matrix.serialport }}; do
            # A renamed package can linger as an empty record that apt-cache
            # still "shows" successfully, so look for a real Package: entry.
            if apt-cache show "$candidate" 2>/dev/null | grep -q '^Package:'; then
              serialport="$candidate"
              break
            fi
          done
          sudo apt-get install -y cmake ninja-build ${{ matrix.packages }} "${serialport:?no Qt SerialPort development package found}"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  qmake-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 5 and checks
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qt5-qmake qtbase5-dev libqt5serialport5-dev shellcheck
      - name: Build with qmake
        run: |
          mkdir qmake-build
          cd qmake-build
          qmake ../SerialPort.pro
          make -j"$(nproc)"
      - name: Check shell scripts
        run: shellcheck gen_deb.sh script/*.sh
